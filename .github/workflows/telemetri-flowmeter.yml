name: Telemetri flowmeter (Telegram Onpoint)
on:
  schedule:
    - cron: "*/15 * * * *"   # tiap 15 menit (GitHub kadang menunda jadwal; data Onpoint masuk tiap jam)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: telemetri
jobs:
  ambil:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { path: main }
      - name: Siapkan cabang data
        run: |
          git clone --depth 1 --branch telemetri "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data \
            || (mkdir data && cd data && git init -b telemetri && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git")
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install telethon==1.36.0
      - name: Baca grup Telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_GROUP: ${{ secrets.TG_GROUP }}
          TG_ALERT_CHAT: ${{ secrets.TG_ALERT_CHAT }}
        run: python main/tools/telegram_flow.py data/flow.json
      - name: Simpan ke cabang telemetri
        run: |
          cd data
          git config user.name "geospam-bot"; git config user.email "geospam-bot@users.noreply.github.com"
          git add flow.json
          git diff --cached --quiet && exit 0
          git commit -m "Data flowmeter $(date -u +%FT%TZ)" && git push origin telemetri
