[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Proxy telemetri AWLR BWS Kalimantan III (hindari blokir CORS)
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/awlr/*"
  to = "https://opsdabwskal3.higertech.com/Station/:splat"
  status = 200
  force = true
