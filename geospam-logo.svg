  </g>
  <circle cx="70" cy="410" r="13" fill="#05121f" stroke="#63e6be" stroke-width="7"/>
  <circle cx="446" cy="392" r="13" fill="#05121f" stroke="#b197fc" stroke-width="7"/>
  <!-- pin lokasi -->
  <path d="M256 66c-74 0-134 58-134 132 0 98 134 222 134 222s134-124 134-222c0-74-60-132-134-132z" fill="url(#pin)"/>
